# Project:   vector-vrl
# File:      .github/workflows/ci.yml
# Purpose:   CI for the 3-component repo (vector-bindings Rust crate,
#            vector-vrl Python package, build/ orchestration tooling).
#
# The jobs and the release trailer: CONTRIBUTING.md.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: ""
        description: "Tag to re-publish (existing tag). Omit + set from-head to release HEAD."
      from-head:
        type: string
        required: false
        default: ""
        description: "'true' to release/retry the current HEAD - the CI creates the tag."
      bump:
        type: string
        required: false
        default: "auto"
        description: "Version resolution for from-head: auto | patch | minor | X.Y.Z."

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Without --python, uv takes the runner's interpreter and resolves the newest hyperi-ci that runs on it.
  HYPERCI_INSTALL: ${{ vars.HYPERCI_INSTALL_OVERRIDE || 'uvx --python 3.14 --no-cache --refresh hyperi-ci' }}

jobs:
  plan:
    name: Plan
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    # predict-version runs semantic-release, whose git plugin verifies push
    # access on a publish predict.
    permissions:
      contents: write
    outputs:
      run-checks: ${{ steps.predict.outputs.run-checks }}
      run-build: ${{ steps.predict.outputs.run-build }}
      will-release: ${{ steps.predict.outputs.will-release }}
      next-version: ${{ steps.predict.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # semantic-release's dry-run reads full history

      - name: Predict version + derive gates
        id: predict
        uses: hyperi-io/hyperi-ci/.github/actions/predict-version@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag }}
          from-head: ${{ inputs.from-head }}
          bump: ${{ inputs.bump }}

  commit-check:
    name: Commit messages
    # The version bump is derived from these messages, so they are validated on
    # every merge to main rather than only on publish-worthy pushes.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request'
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    # check-commits reads the PR title from the GitHub API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Validate commit messages
        env:
          GH_TOKEN: ${{ github.token }}
        run: ${{ env.HYPERCI_INSTALL }} check-commits

  quality-test-rust:
    name: vector-bindings (quality + test)
    needs: [plan]
    if: needs.plan.outputs.run-checks == 'true'
    runs-on: ${{ vars.GH_RUNNER_RUST || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      # The Rust quality gate runs cargo audit and cargo deny, pinned by hyperi-ci.
      - uses: hyperi-io/hyperi-ci/.github/actions/setup-rust-tools@main
      # The quality gate's malicious-package scan, pinned by hyperi-ci.
      - uses: hyperi-io/hyperi-ci/.github/actions/setup-osv-scanner@main
      # make test-rust runs the suite under cargo-nextest, pinned by hyperi-ci.
      - uses: hyperi-io/hyperi-ci/.github/actions/setup-nextest@main
      # Pin the interpreter pyo3-build-config finds, not the runner image's default.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: make quality-rust
      - run: make test-rust

  quality-test-python:
    name: vector-vrl + build/ (quality + test)
    needs: [plan]
    if: needs.plan.outputs.run-checks == 'true'
    runs-on: ${{ vars.GH_RUNNER_PYTHON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # The binary-gated integration tests fail under $CI without one. The version is _VECTOR_TAG in tests/conftest.py.
      - name: Install the pinned vector binary
        run: |
          version="$(sed -n 's/^_VECTOR_TAG = "\(.*\)-debian"$/\1/p' vector-vrl/tests/conftest.py)"
          test -n "$version" || { echo "::error::could not read _VECTOR_TAG from vector-vrl/tests/conftest.py"; exit 1; }
          target="$(uname -m)-unknown-linux-gnu"
          name="vector-${version}-${target}.tar.gz"
          base="https://github.com/vectordotdev/vector/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$name" "${base}/${name}"
          curl -sSfL -o vector-SHA256SUMS "${base}/vector-${version}-SHA256SUMS"
          # An empty match fails sha256sum -c, so a missing entry stops the job.
          awk -v n="$name" '$2 == n' vector-SHA256SUMS | sha256sum -c -
          tar -xzf "$name"
          echo "$RUNNER_TEMP/vector-${target}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/vector-${target}/bin/vector" --version

      - run: make quality-python
      - run: make quality-docs
      - run: make test-python

  build-wheels:
    name: Build wheel (${{ matrix.name }})
    needs: [plan, quality-test-rust, quality-test-python]
    if: needs.plan.outputs.run-build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # maturin-action builds in a manylinux container, which gives the manylinux tag PyPI accepts.
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Native arm64 runner - no QEMU, the manylinux container runs natively.
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # One wheel per Mac architecture, both from the arm64 runner: abi3 links no libpython, so it cross-compiles.
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          # Cross-built, so the smoke check can't install it on this runner.
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Both Mac legs run on the arm64 runner, so without a suffix they derive one cache key and race to save it.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-suffix: ${{ matrix.name }}

      - name: Stamp the predicted version
        # `vector_vrl.__version__` reads the package metadata, so the wheel carries the version about to be tagged.
        if: needs.plan.outputs.will-release == 'true' && (github.event_name == 'push' || inputs.from-head == 'true')
        env:
          VERSION: ${{ needs.plan.outputs.next-version }}
        run: ${{ env.HYPERCI_INSTALL }} stamp-version "$VERSION" -C vector-vrl

      # The macOS build interpreter. The Linux legs use the manylinux container's, via --find-interpreter.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # manylinux keeps its CPythons under /opt/python, off PATH. abi3 makes one wheel however many it finds.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: vector-vrl
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto # ignored on macOS

      # Runs VRL through the wheel just built, installed in a throwaway venv.
      - if: matrix.cross != true
        run: python3 build/wheel_smoke_check.py vector-vrl/dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vector-vrl-wheel-${{ matrix.name }}
          path: vector-vrl/dist/*
          retention-days: 7

  tag-and-release:
    name: Tag & Release
    needs: [plan, build-wheels]
    if: needs.plan.outputs.will-release == 'true'
    runs-on: ${{ vars.GH_RUNNER_PUBLISH || 'ubuntu-latest' }}
    environment: pypi-publish
    permissions:
      contents: write # semantic-release tag + release-commit
      issues: write # release-notify
      pull-requests: write
      # hyperi-ci's publish handler passes --token when PYPI_TOKEN is set and falls back to OIDC when it isn't.
      id-token: write
    env:
      # The `secrets` context is not readable from a step-level `if`, and the
      # release identity turns on whether this repo can see the App key.
      RELEASE_APP_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On push or a from-head dispatch, check out main HEAD so the tag is
          # created there. On a tag dispatch the tag already exists.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mint the release bot token
        # A GITHUB_TOKEN push triggers no workflows and can't bypass a branch ruleset, so the release pushes as the app.
        id: bot
        if: env.RELEASE_APP_KEY != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ env.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Report the release identity
        # A silent fall back to github-actions is what makes a missing ruleset
        # bypass look like a working release, so say which identity is in use.
        run: |
          if [ "${{ steps.bot.outcome }}" = "success" ]; then
            echo "Tagging and pushing as the release app."
          else
            echo "::warning::GH_APP_PRIVATE_KEY is not visible to this repo - tagging as github-actions. Required status checks cannot be bypassed, and the release push will trigger no workflows."
          fi

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Setup semantic-release (shared toolchain)
        if: ${{ github.event_name == 'push' || (inputs.from-head == 'true' && inputs.bump == 'auto') }}
        uses: hyperi-io/hyperi-ci/.github/actions/setup-semantic-release@main

      - name: Guard - the predicted tag must not already exist off-HEAD
        # semantic-release is blind to tags off HEAD, and tagging past one would rewrite release history.
        if: ${{ github.event_name == 'push' || (inputs.from-head == 'true' && inputs.bump == 'auto') }}
        run: |
          predicted="v${{ needs.plan.outputs.next-version }}"
          if git rev-parse -q --verify "refs/tags/${predicted}^{commit}" >/dev/null 2>&1
          then
            existing=$(git rev-parse "refs/tags/${predicted}^{commit}")
            head=$(git rev-parse "HEAD^{commit}")
            if [ "$existing" != "$head" ]
            then
              echo "::error::Predicted ${predicted} already exists at ${existing} but HEAD is ${head}. Refusing to auto-tag. Ship past it with 'hyperi-ci release --version X.Y.Z'."
              exit 1
            fi
            echo "${predicted} already exists at HEAD - nothing to tag."
          fi

      - name: Tag (semantic-release)
        # Picks the version plan predicted, so the wheels already carry it.
        if: ${{ github.event_name == 'push' || (inputs.from-head == 'true' && inputs.bump == 'auto') }}
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
        run: semantic-release

      - name: Tag HEAD (forced bump / explicit version)
        # semantic-release cannot force a version. tag-head takes last tag + bump, or an exact X.Y.Z.
        id: forcedtag
        if: ${{ inputs.from-head == 'true' && inputs.bump != 'auto' && inputs.bump != '' }}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
        run: ${{ env.HYPERCI_INSTALL }} tag-head --bump ${{ inputs.bump }}

      - name: Download the built wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vector-vrl-wheel-*
          path: vector-vrl/dist/
          merge-multiple: true

      - name: Publish to PyPI
        id: publish
        working-directory: vector-vrl
        env:
          HYPERCI_VERSION: ${{ steps.forcedtag.outputs.version || needs.plan.outputs.next-version }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          # The step cuts the GitHub Release after the upload, and fails without a gh token.
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
        run: ${{ env.HYPERCI_INSTALL }} run release -C .

      - name: Stamp the released version
        # The build's stamp ran on another runner, so VERSION has not moved in this checkout.
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ steps.forcedtag.outputs.version || needs.plan.outputs.next-version }}
          # The repo root has no package manifest, so VERSION is the only file to stamp.
          HYPERI_CI_LANGUAGE: none
        run: ${{ env.HYPERCI_INSTALL }} stamp-version "$RELEASE_VERSION"

      - name: Commit the rendered release artefacts
        # An untagged commit, so no tag points at machine-authored history.
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
        run: >-
          ${{ env.HYPERCI_INSTALL }} release-commit
          "${{ steps.forcedtag.outputs.version || needs.plan.outputs.next-version }}"

      - name: Announce the release
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ${{ env.HYPERCI_INSTALL }} release-notify
          "${{ steps.forcedtag.outputs.version || needs.plan.outputs.next-version }}"
          --outcome success

      - name: Record a failed release
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ${{ env.HYPERCI_INSTALL }} release-notify
          "${{ steps.forcedtag.outputs.version || needs.plan.outputs.next-version }}"
          --outcome failure
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
