name: Deploy to JFrog PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (leave empty to use current)'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy-to-jfrog:
    name: Deploy vectordotdev to JFrog Artifactory
    runs-on: ubuntu-latest
    # Skip GitHub deployment if local ENV/credentials are configured
    if: ""${{ secrets.DISABLE_GITHUB_JFROG }} != 'true'

    steps:
    - name: Check deployment mode
      run: |
        echo "🔍 JFrog Deployment Mode Check"
        echo "================================"
        echo "GitHub Actions deployment: ENABLED"
        echo "Local ENV deployment: Not configured"
        echo ""
        echo "ℹ️ To disable GitHub Actions and use local deployment:"
        echo "1. Add ARTIFACTORY_TENANT_USERNAME/PASSWORD to local ENV or build/.env"
        echo "2. Add DISABLE_GITHUB_JFROG=true to repository secrets"
        echo "3. Use: ./build/build --deploy for local deployment"
        echo ""
        echo "Proceeding with GitHub Actions deployment..."
    
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Install deployment tools only
      run: |
        python -m pip install --upgrade pip twine
    
    - name: Check for pre-built wheel
      run: |
        echo "🔍 Checking for locally-built wheel..."
        if [ ! -d "vectordotdev/dist" ] || [ -z "$(ls vectordotdev/dist/*.whl 2>/dev/null)" ]; then
          echo "❌ ERROR: No locally-built wheel found!"
          echo ""
          echo "Please build locally first:"
          echo "1. Run: ./build/build --verbose"  
          echo "2. Run: cd vectordotdev && python build_wheel.py"
          echo "3. Commit wheel: git add vectordotdev/dist/*.whl && git commit"
          echo "4. Push: git push"
          exit 1
        fi
        echo "✅ Locally-built wheel found:"
        ls -la vectordotdev/dist/
    
    - name: Get package version from wheel
      id: version
      run: |
        cd vectordotdev/dist
        WHEEL_FILE=$(ls *.whl | head -1)
        VERSION=$(echo "$WHEEL_FILE" | sed 's/.*-\([0-9][^-]*\)-.*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Deploying pre-built wheel: $WHEEL_FILE (version: $VERSION)"
    
    - name: Check JFrog credentials
      run: |
        echo "🔍 Checking JFrog credential availability..."
        
        # Check if organization secrets are accessible
        if [ -n "${{ secrets.ARTIFACTORY_TENANT_USERNAME }}" ]; then
          echo "✅ ARTIFACTORY_TENANT_USERNAME: Available"
        else
          echo "❌ ARTIFACTORY_TENANT_USERNAME: Not available"
        fi
        
        if [ -n "${{ secrets.ARTIFACTORY_TENANT_PASSWORD }}" ]; then
          echo "✅ ARTIFACTORY_TENANT_PASSWORD: Available"  
        else
          echo "❌ ARTIFACTORY_TENANT_PASSWORD: Not available"
        fi
        
        # Try alternative secret names in case they're named differently
        if [ -n "${{ secrets.ARTIFACTORY_USERNAME }}" ]; then
          echo "ℹ️ ARTIFACTORY_USERNAME also available (alternative)"
        fi
        
        if [ -n "${{ secrets.ARTIFACTORY_PASSWORD }}" ]; then
          echo "ℹ️ ARTIFACTORY_PASSWORD also available (alternative)"
        fi
        
        if [ -n "${{ secrets.JFROG_ACCESS_TOKEN }}" ]; then
          echo "ℹ️ JFROG_ACCESS_TOKEN available (token-based auth)"
        fi
        
        # Fail only if no JFrog credentials found
        if [ -z "${{ secrets.ARTIFACTORY_TENANT_USERNAME }}" ] && [ -z "${{ secrets.ARTIFACTORY_USERNAME }}" ] && [ -z "${{ secrets.JFROG_ACCESS_TOKEN }}" ]; then
          echo ""
          echo "❌ ERROR: No JFrog credentials accessible!"
          echo "Organization secrets exist but may not be accessible to this repository."
          echo "Check: Repository Settings → Secrets and variables → Actions → Organization secrets"
          exit 1
        fi
        
        echo "✅ JFrog credentials found"
    
    - name: Deploy to JFrog Artifactory
      env:
        TWINE_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        JFROG_TOKEN: ${{ secrets.JFROG_ACCESS_TOKEN }}
        TWINE_REPOSITORY_URL: "https://hypersec.jfrog.io/artifactory/api/pypi/hypersec-pypi-local/"
      run: |
        cd vectordotdev
        echo "📦 Deploying vectordotdev to JFrog Artifactory..."
        echo "Repository: $TWINE_REPOSITORY_URL"
        echo "Version: ${{ steps.version.outputs.version }}"
        echo ""
        echo "Package contents:"
        ls -la dist/
        echo ""
        
        # Upload packages using twine
        twine upload --verbose dist/*
        
        echo ""
        echo "✅ SUCCESS: vectordotdev deployed to JFrog Artifactory!"
        echo ""
        echo "To install:"
        echo "  pip install vectordotdev==${{ steps.version.outputs.version }} \\"
        echo "    --index-url $TWINE_REPOSITORY_URL"
    
    - name: Create deployment summary
      if: always()
      run: |
        cd vectordotdev
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # JFrog vectordotdev Deployment Summary
        
        ## Package Information
        - **Package**: vectordotdev
        - **Version**: ${{ steps.version.outputs.version }}
        - **Repository**: hypersec-pypi-local
        - **Time**: $(date)
        
        ## Artifacts Deployed
        \`\`\`
        $(ls -lh dist/)
        \`\`\`
        
        ## Installation Command
        \`\`\`bash
        pip install vectordotdev==${{ steps.version.outputs.version }} \\
          --index-url https://hypersec.jfrog.io/artifactory/api/pypi/hypersec-pypi-local/simple
        \`\`\`
        
        ## Package Contents
        - 🐍 Pure Python package in /vectordotdev/src
        - 🦀 Bundled Rust bindings from /vector-bindings  
        - ⚡ Complete Vector integration (all modules)
        - 🔄 regex2vrl conversion tool
        - 🛑 Auto-stop functionality
        - 📊 Comprehensive testing suite
        
        ## View in JFrog
        [Open JFrog Artifactory](https://hypersec.jfrog.io)
        EOF