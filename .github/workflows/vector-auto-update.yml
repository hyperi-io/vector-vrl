# Project:   vectordotdev
# File:      .github/workflows/vector-auto-update.yml
# Purpose:   Daily check for a new Vector release (7-day release-age
#            cooldown - build/vector_pin.py skips anything newer); try it,
#            and only ship if it actually builds and passes.
#
# Never touches main on a red result - the commit only happens after the
# same `make check` gate every normal push gets passes clean. A push made
# with the default GITHUB_TOKEN does not retrigger other workflows (GitHub's
# own anti-recursion rule), so the real ci.yml pipeline - which builds the
# multi-platform wheels and publishes - is invoked explicitly afterwards via
# workflow_dispatch rather than relied on to fire from the push.
#
# Requires this repo's Settings -> Actions -> General -> Workflow permissions
# set to "Read and write permissions" (for the commit/push and the
# workflow_dispatch call) - a one-time repo setting, not something this file
# can grant itself.

name: Vector auto-update

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch: {}

concurrency:
  group: vector-auto-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  check:
    name: Check for a new Vector release
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        working-directory: build
        run: |
          if python3 vector_pin.py check 2>&1 | tee /tmp/vector-pin-check.log | grep -q '::warning::'; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/vector-pin-check.log

  try-update:
    name: Try the bump
    needs: check
    if: needs.check.outputs.stale == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Attempt the Vector version bump
        working-directory: build
        run: python3 vector_pin.py update
      - name: Verify - the same gate every normal push gets
        run: make check
      # Reached only if `make check` passed. Nothing above this line
      # touches git state, so a failure leaves main untouched.
      - name: Commit and trigger the real pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(grep -oP '_VECTOR_TAG = "\K[^"]+' vectordotdev/tests/conftest.py)
          git commit -am "fix: bump pinned Vector version to ${NEW_VERSION}"
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  notify-failure:
    name: Alert on a failed attempt
    needs: [check, try-update]
    if: always() && needs.check.outputs.stale == 'true' && needs.try-update.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          gh issue create \
            --title "Vector auto-update failed - manual bump needed" \
            --body "The daily Vector version check found a newer release, but \`make check\` failed against it - see the [failed run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Nothing was committed or published; the pinned version is unchanged. Run \`python3 build/vector_pin.py update\` locally to reproduce and fix."
        env:
          GH_TOKEN: ${{ github.token }}
