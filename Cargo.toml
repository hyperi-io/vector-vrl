[package]
name = "pyvector"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
description = "Python bindings for Vector data processing pipelines"
repository = "https://github.com/hypersec-io/pyvector-rs"

[lib]
name = "pyvector"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = ">=0.21.2", features = ["extension-module", "experimental-async"] }
tokio = { version = ">=1.37.0", features = ["full"] }
async-trait = ">=0.1.80"
derivative = ">=2.2.0"
inventory = ">=0.3.15"
serde = ">=1.0.200"
serde_with = ">=3.0.0"
toml = { version = ">=0.8.12", default-features = false }
typetag = ">=0.2.16"
vector = { git = "https://github.com/vectordotdev/vector.git", tag = "v0.49.0", default-features = false, features = [
    "transforms-logs",
    "transforms-metrics", 
    "sinks-logs",
    "sinks-metrics",
] }
vector-lib = { git = "https://github.com/vectordotdev/vector.git", tag = "v0.49.0", default-features = false}
tokio-stream = { version = ">=0.1.17", default-features = false }
bytes = ">=1.6.0"
openssl-probe = ">=0.1.5"
tracing = { version = ">=0.1.40", features = ["max_level_info", "release_max_level_info"] }
once_cell = ">=1.19.0"

[package.metadata.cargo-machete]
ignored = ["inventory", "serde", "toml"]

# Dependency update configuration
[package.metadata.update-policy]
# Update policy for automatic dependency management
# "latest" - Always use latest stable versions (default)
# "pinned" - Never auto-update (use exact versions from lock file)
policy = "latest"

# Vector update strategy
# "latest-stable" - Use latest stable release (no pre-release tags)
# "latest-any" - Use latest release including pre-releases
vector-strategy = "latest-stable"

[profile.release]
lto = "thin"

[profile.ci]
inherits = "release"
incremental = false
debug = "line-tables-only"
opt-level = 3
lto = "thin"
codegen-units = 1
