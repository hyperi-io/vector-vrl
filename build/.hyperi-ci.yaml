# Project:   build
# File:      .hyperi-ci.yaml
# Purpose:   HyperI CI configuration
#
# License:   Apache-2.0
# Copyright: (c) 2026 HyperSec
#
# Internal orchestration tooling, not published.
#
# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

language: python
license: Apache-2.0
classification: general-oss
project:
  status: experimental
quality:
  enabled: true
test:
  enabled: true
  # Flat module layout (build_system.py, common.py, ... - no src/ package),
  # so hyperi-ci's fixed `--cov=src` convention has nothing to measure here
  # regardless of how well-tested this component is. vectordotdev/ (the
  # published package) keeps full coverage enforcement; this is scoped to
  # the internal orchestration CLI only.
  coverage: false
build:
  enabled: true
  strategies:
  - native
  type: package
publish:
  enabled: false
