# Project:   build
# File:      .hyperi-ci.yaml
# Purpose:   HyperI CI configuration
#
# License:   Apache-2.0
# Copyright: (c) 2026 HyperSec
#
# Internal orchestration tooling, not published.
#
# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

language: python
license: Apache-2.0
classification: general-oss
project:
  status: experimental
quality:
  enabled: true
  dep_licenses:
    overrides:
      # The wheel ships no licence file. The text is upstream's, taken at the same version.
      - {name: loguru, version: "0.7.3", licence: MIT, reason: "Q282 A: upstream LICENSE at tag 0.7.3", licence_file: third_party/loguru-0.7.3-LICENSE}
      # Its metadata says only "BSD License", so the gate cannot name the variant.
      - {name: httpx, version: "0.28.1", licence: BSD-3-Clause, reason: "Q282 A: upstream LICENSE.md at tag 0.28.1 is BSD-3-Clause"}
test:
  enabled: true
  # Flat module layout (build_system.py, common.py, ... - no src/ package),
  # so hyperi-ci's fixed `--cov=src` convention has nothing to measure here
  # regardless of how well-tested this component is. vector-vrl/ (the
  # published package) keeps full coverage enforcement; this is scoped to
  # the internal orchestration CLI only.
  coverage: false
build:
  enabled: true
  strategies:
  - native
release:
  enabled: false
