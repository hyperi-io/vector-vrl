[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Run in place, never installed: setuptools' flat-layout discovery refuses this many top-level modules.
package = false
# Supply-chain cooldown. A CVE fix bypasses it with a per-package exclude-newer-package entry.
exclude-newer = "7 days"
# Our own releases are exempt: hyperi-ci before 2.15.1 fails pip-audit on a runner home that another user can write to.
exclude-newer-package = { hyperi-ci = false, scalo = false }

[project]
name = "vector-vrl-build-system"
version = "0.1.0"
description = "Build system for vector-vrl"
requires-python = ">=3.14"
dependencies = [
    "scalo[http]>=2.31.10",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # The quality stage runs ruff from this venv. Same minor as vector-vrl's lock.
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0,<0.18",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "D"]
ignore = ["E501", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
