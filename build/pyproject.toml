[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectordotdev-build-system"
version = "0.1.0"
description = "Build system for vectordotdev"
requires-python = ">=3.12"
dependencies = [
    "scalo[http]>=2.28.5",
    "pyyaml>=6.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0"
]