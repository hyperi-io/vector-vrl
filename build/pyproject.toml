[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectordotdev-build-system"
version = "0.1.0"
description = "Build system for vectordotdev"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0", 
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "toml>=0.10.0"
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0"
]