[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# An orchestration CLI run in place (`./build/build`), never pip-installed
# or imported by another package - `package = false` stops `uv sync` from
# building it as an installable distribution, which setuptools' flat-layout
# auto-discovery refuses once the directory holds more than one top-level
# module (build_system.py, common.py, core_build.py, ...).
package = false

[project]
name = "vector-vrl-build-system"
version = "0.1.0"
description = "Build system for vector-vrl"
requires-python = ">=3.14"
dependencies = [
    "scalo[http]>=2.31.10",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # The quality stage spawns `ruff` from this project's own environment;
    # without it declared here the checks pass only where a ruff happens to
    # be on PATH, and fail on a clean runner. Held to the same minor as
    # vector-vrl's lock so one repo is not linted by two ruff versions.
    "ruff>=0.17.0,<0.18",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "D"]
ignore = ["E501", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
