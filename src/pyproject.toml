[project]
name = "pyvector-python-tools"
version = "0.1.0"
description = "Python tools for pyvector-rs including smart build system and test utilities"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "click>=8.1.0", 
    "rich>=13.0.0",
    "typer>=0.15.0",
    "gitpython>=3.1.0",
    "dynaconf>=3.2.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=22.0", "ruff>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "black>=22.0", 
    "ruff>=0.1.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
ignore = ["E501", "PLR0913", "PLR0912", "C901", "PLR0915"]