# The component layout: CONTRIBUTING.md. Defaults: config/defaults.yaml in hyperi-ci.

language: rust
classification: general-oss
project:
  status: experimental
quality:
  enabled: true
test:
  enabled: true
  coverage: false
  rust:
    # In turn, not --all-features: the sandbox test exists only on the default build.
    features: default|full-stdlib
    # A missing nextest fails the stage rather than falling back to cargo test.
    nextest: true
build:
  enabled: true
  strategies:
  - native
  rust:
    features: all
    targets: []
release:
  enabled: false
