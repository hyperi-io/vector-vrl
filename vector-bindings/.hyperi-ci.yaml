# Project:   vector-bindings
# File:      .hyperi-ci.yaml
# Purpose:   HyperI CI configuration
#
# License:   Apache-2.0
# Copyright: (c) 2026 HyperSec
#
# Internal crate: builds and tests here, does NOT publish standalone.
# The publishable artefact is ../vector-vrl (maturin wraps this crate).
#
# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

language: rust
license: Apache-2.0
classification: general-oss
project:
  status: experimental
quality:
  enabled: true
test:
  enabled: true
  coverage: false
  rust:
    # Both feature sets, run in turn. The sandbox regression test
    # (env_system_network_functions_are_unavailable) exists only on the
    # default build and its mirror only under full-stdlib, so a single
    # --all-features run would silently skip the sandbox one.
    features: default|full-stdlib
    # Require process-per-test isolation rather than accepting whatever the
    # runner has: a missing nextest fails the stage instead of quietly
    # switching to cargo test's shared-process semantics.
    nextest: true
build:
  enabled: true
  strategies:
  - native
  rust:
    features: all
    targets: []
publish:
  enabled: false
