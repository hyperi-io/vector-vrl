[package]
name = "vector-bindings"
version = "1.0.5"
edition = "2024"
description = "PyO3 bindings for Vector data processing"
authors = ["HyperI"]
license = "Apache-2.0"

[lib]
name = "vector_bindings"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde_json = { version = "1.0.142", default-features = false, features = ["std"] }
# VRL - synced from Vector's workspace dependencies (NO HARDCODING).
# stdlib-base only, NOT the default `stdlib`/`cli`: this crate executes
# caller-supplied VRL text, so enable_env_functions/enable_system_functions/
# enable_network_functions (get_env_var, http_request, dns_lookup,
# get_hostname) must stay off. enable_crypto_functions is safe to keep.
vrl = { git = "https://github.com/vectordotdev/vrl.git", branch = "main", default-features = false, features = ["stdlib-base", "enable_crypto_functions"] }

[features]
default = []
abi3 = ["pyo3/abi3-py38"]