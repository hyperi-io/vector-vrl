[package]
name = "vector-bindings"
version = "1.0.5"
edition = "2021"
description = "PyO3 bindings for Vector data processing"
authors = ["vectordotdev team"]
license = "Apache-2.0"

[lib]
name = "vector_bindings"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0.219", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.142", default-features = false, features = ["std"] }
tokio = { version = "1.45.1", default-features = false, features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
# VRL - synced from Vector's workspace dependencies (NO HARDCODING)
vrl = { git = "https://github.com/vectordotdev/vrl.git", branch = "main", features = ["cli"] }
ordered-float = "4.5"

yaml-rust2 = "0.8"

[build-dependencies]
pyo3-build-config = "0.22"
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
quote = "1.0"
walkdir = "2.5"

[features]
default = []
abi3 = ["pyo3/abi3-py38"]