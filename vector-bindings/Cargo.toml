[package]
name = "vector-bindings"
version = "0.1.0"
edition = "2021"
description = "Intermediate bindings layer for Vector core"

[lib]
name = "vector_bindings"
crate-type = ["rlib", "cdylib"]  # cdylib for Python extension

[dependencies]
# Use same dependency versions as Vector (from /vector workspace.dependencies)
# Adjusted for PyO3 compatibility where needed
tokio = { version = "1.45.1", default-features = false, features = ["full"] }
serde = { version = "1.0.219", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.142", default-features = false, features = ["std"] }
serde_yaml = { version = "0.9.34", default-features = false }
toml = { version = "0.9.4", default-features = false, features = ["parse", "serde"] }
uuid = { version = "1.17.0", default-features = false }
anyhow = { version = "1.0.98", default-features = false }
thiserror = "1.0.60"
tracing = "0.1.40"

# Vector-compatible dependencies
futures = { version = "0.3.31", default-features = false, features = ["std"] }
indexmap = { version = "2.10.0", default-features = false, features = ["std"] }
paste = { version = "1.0.15" }
pin-project = { version = "1.1.10", default-features = false }

# PyO3 for eventual Python integration (optional)
pyo3 = { version = "0.21.2", features = ["extension-module"], optional = true }

# Vector integration dependencies  
# Auto-detect compatible versions - DO NOT hardcode versions
# This will be managed by the build system's auto-detection logic

[features]
default = ["python"]  # Enable PyO3 by default
python = ["pyo3"]     # PyO3 integration for Python bindings

[build-dependencies]
# Build script to discover and link against Vector build artifacts from /vector/target/