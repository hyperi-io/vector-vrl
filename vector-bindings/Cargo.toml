[package]
name = "vector-bindings"
version = "1.0.5"
edition = "2024"
description = "PyO3 bindings for Vector data processing"
authors = ["HyperI"]
license = "Apache-2.0"

[lib]
name = "vector_bindings"
crate-type = ["cdylib"]

[dependencies]
# Redacts secret values from runtime errors. regex already pulls it in.
aho-corasick = "1.1"
# CPython's stable ABI: one wheel per platform. docs/how-to-build-and-test.md.
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py312"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
# Parses a registered `file` enrichment table. vrl's stdlib-base already pulls it in.
csv = "1.4"
# Reads registered `geoip` tables. 0.31 and later bound the decode work a crafted database can force.
maxminddb = "0.32"
# Sandboxed feature set. What it holds back: docs/architecture.md, "What caller-supplied VRL cannot reach".
vrl = { git = "https://github.com/vectordotdev/vrl.git", branch = "main", default-features = false, features = ["stdlib-base", "enable_crypto_functions"] }

[features]
default = []
# Trusted VRL only: adds the host, DNS and HTTP functions. The published wheel is built without it.
full-stdlib = ["vrl/stdlib"]