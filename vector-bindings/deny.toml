[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "deny"
ignore = [
    # Both fixed by the pyo3 0.29+ migration already needed to build
    # against Python 3.14 (pyo3 0.22 caps at 3.13).
    { id = "RUSTSEC-2025-0020", reason = "fixed by the pending pyo3 0.24.1+ upgrade" },
    { id = "RUSTSEC-2026-0177", reason = "fixed by the pending pyo3 0.29+ upgrade" },
]

[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "BSL-1.0", "CC0-1.0", "MPL-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
# "deny" would fail on `vrl` (git = ..., branch = "main", no version) -
# a deliberate, documented choice (repo CLAUDE.md) to always track vrl's
# main branch, not an accidental floating dependency.
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/vectordotdev/vrl.git"]
