[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "deny"
ignore = [
    # vrl -> serde_yaml_ng -> unsafe-libyaml, on vrl's normal and build edges both.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained, not a vulnerability, and has no safe upgrade. vrl's build.rs parses its bundled regex YAML through it, and so does vrl's parse_yaml function on the event data a VRL program passes it. Drop when vrl moves to a maintained YAML parser." },
]

[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "BSL-1.0", "CC0-1.0", "MPL-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
# "deny" would fail on `vrl` (git = ..., branch = "main", no version) -
# a deliberate, documented choice (repo CLAUDE.md) to always track vrl's
# main branch, not an accidental floating dependency.
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/vectordotdev/vrl.git"]
