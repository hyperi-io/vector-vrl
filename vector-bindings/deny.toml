[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "deny"
ignore = [
    # vrl -> serde_yaml_ng -> unsafe-libyaml, on vrl's normal and build edges both.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained, not a vulnerability, and has no safe upgrade. vrl's build.rs parses its bundled regex YAML through it, and so does vrl's parse_yaml function on the event data a VRL program passes it. Drop when vrl moves to a maintained YAML parser." },
    # reqwest-retry -> wasmtimer -> pin-utils, a cfg(target_arch = "wasm32") dependency of reqwest-retry.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils is unmaintained, not a vulnerability, and only wasmtimer pulls it in, for wasm32 only. This crate is a native PyO3 cdylib, so it never compiles pin-utils." },
    # vrl -> chrono and chrono-tz, in vrl's date and timestamp handling.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, not a vulnerability, and has no patched version. vrl needs it for timestamps, so there is nothing to swap here. Drop when vrl moves to another time crate." },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained, not a vulnerability, and has no patched version. vrl needs it for timezone conversion. Drop when vrl moves to another time crate." },
]

[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "BSL-1.0", "CC0-1.0", "MPL-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
# "deny" would fail on vrl, which tracks its git main branch on purpose (CONTRIBUTING.md, Context).
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/vectordotdev/vrl.git"]
