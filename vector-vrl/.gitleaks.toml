# Allowlists on top of the default rules, which useDefault loads.
# hyperi-ci reads this file from each component directory, so vector-bindings/, vector-vrl/ and build/ keep copies.
[extend]
useDefault = true

[[allowlists]]
description = "vector/ is upstream Vector's own source tree (gitignored, read-only). Its test fixtures are Vector's own public dummy credentials, not secrets belonging to this repo."
paths = [
  '''^vector/''',
]
