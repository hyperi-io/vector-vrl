# Project:   vector-vrl
# File:      .hyperi-ci.yaml
# Purpose:   HyperI CI configuration
#
# License:   Apache-2.0
# Copyright: (c) 2026 HyperSec
#
# The publishable artefact: maturin build wraps ../vector-bindings.
# release stays gated - fires only on the Release: true trailer or an
# explicit workflow_dispatch, never on a plain push.
#
# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

language: python
license: Apache-2.0
classification: general-oss
project:
  status: experimental
quality:
  enabled: true
test:
  enabled: true
build:
  enabled: true
  strategies:
  - native
release:
  enabled: true
  # Wheels go to PyPI only; there are no standalone binaries to publish.
  destinations:
    binaries: false
