# The release trailer: CONTRIBUTING.md. Defaults: config/defaults.yaml in hyperi-ci.

language: python
classification: general-oss
project:
  status: experimental
quality:
  enabled: true
test:
  enabled: true
build:
  enabled: true
  strategies:
  - native
release:
  enabled: true
  # Wheels go to PyPI. There are no standalone binaries to publish.
  destinations:
    binaries: false
