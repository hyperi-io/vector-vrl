name: Smart Vector Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 6 AM UTC to check for new Vector versions
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force Vector version update'
        required: false
        default: 'false'
        type: boolean
      run_tests:
        description: 'Run test suite after build'
        required: false
        default: 'true'
        type: boolean

jobs:
  smart-build:
    runs-on: ubuntu-latest

    outputs:
      vector_version: ${{ steps.build.outputs.vector_version }}
      build_status: ${{ steps.build.outputs.build_status }}

    steps:
    - name: Checkout code with LFS
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Configure Git LFS
      run: |
        git lfs install
        git lfs pull

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libssl-dev protobuf-compiler git-lfs

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy

    - name: Install Python and uv
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache Rust dependencies (with LFS support)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/release/deps
          build/.venv
        key: ${{ runner.os }}-vector-vrl-${{ hashFiles('**/Cargo.toml', 'build/config/*.yaml') }}-${{ github.run_number }}
        restore-keys: |
          ${{ runner.os }}-vector-vrl-${{ hashFiles('**/Cargo.toml', 'build/config/*.yaml') }}-
          ${{ runner.os }}-vector-vrl-

    - name: Smart Vector Build with LFS Caching
      id: build
      env:
        PYVECTOR_CACHING_ENABLED: "true"
        PYVECTOR_USE_CACHE: "true"
        PYVECTOR_VECTOR_PROFILE: ${{ github.event.inputs.vector_profile || 'safe' }}
        BUILD_FORCE_UPDATE: ${{ github.event.inputs.force_update }}
        BUILD_CHECK_FRESHNESS: "true"
        RUN_TESTS: ${{ github.event.inputs.run_tests || 'true' }}
      run: |
        # Initialize LFS if needed
        git lfs install

        # Run smart build with caching
        bash smart-build --max-fallbacks 3

        # Cache successful build artifacts to LFS
        if [ -f ".vector-build-info" ] && grep -q "BUILD_SUCCESS=true" ".vector-build-info"; then
          echo "Build successful - creating LFS cache"
          build/.venv/bin/python build/lfs_cache_manager.py --create-cache
        fi

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: build-info
        path: |
          .vector-build-info
          target/wheels/*.whl
        retention-days: 30

    - name: Create release on successful build
      if: |
        success() &&
        github.ref == 'refs/heads/main' &&
        github.event_name != 'pull_request'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: auto-v${{ steps.build.outputs.vector_version }}-${{ github.run_number }}
        release_name: Auto-build with Vector ${{ steps.build.outputs.vector_version }}
        body: |
          Automated build with Vector version ${{ steps.build.outputs.vector_version }}

          **Build Information:**
          - Vector Version: ${{ steps.build.outputs.vector_version }}
          - Build Status: ${{ steps.build.outputs.build_status }}
          - Commit: ${{ github.sha }}
          - Build Date: ${{ github.event.head_commit.timestamp }}

          This release was automatically generated by the smart build system.
        draft: false
        prerelease: false

  notify:
    needs: smart-build
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'schedule'

    steps:
    - name: Notify on build failure
      run: |
        echo "::error title=Smart Build Failed::Vector version compatibility check failed"
        # Add your notification logic here (Slack, email, etc.)
