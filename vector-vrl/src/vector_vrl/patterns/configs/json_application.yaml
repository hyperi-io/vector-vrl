# JSON Application Logs - Optimized for 500+ THG Performance
# Uses built-in parse_json() for maximum throughput

sources:
  app_logs:
    type: stdin

transforms:
  parse_json_app:
    type: remap
    source: |
      message_str = to_string(.message) ?? ""
      parsed, err = parse_json(message_str)
      if err == null {
          .timestamp = parsed.timestamp
          .level = parsed.level
          .service = parsed.service
          .request_id = parsed.request_id
          .duration_ms = to_int(parsed.duration) ?? 0
          .user_id = parsed.user_id
          .component = parsed.component
          .message_text = parsed.message

          # Performance optimization: cache frequently accessed fields
          .log_level = parsed.level
          .service_name = parsed.service

          # THG optimization: minimize field operations
          .log_type = "json_application"
          .parsed_at = now()
      }

sinks:
  console_output:
    type: console
    inputs: ["parse_json_app"]
    encoding:
      codec: json
