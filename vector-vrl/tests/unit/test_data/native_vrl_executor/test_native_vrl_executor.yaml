# Configuration for test_native_vrl_executor.py
# Test parameters and settings

test_parameters:
  timeout_seconds: 30
  max_test_events: 100
  performance_thresholds:
    min_eps: 100
    target_eps: 500
    excellent_eps: 1000
    min_thg_score: 200
    target_thg_score: 400

test_scenarios:
  json_parsing_production:
    description: "Test JSON parsing with real production-style logs"
    expected_valid_events: 3
    expected_error_events: 1
    min_thg_score: 200

  syslog_parsing_production:
    description: "Test syslog parsing with real syslog format"
    expected_events: 5
    expected_valid_syslog: 4
    expected_error_events: 1

  apache_log_parsing_complex:
    description: "Test complex Apache log parsing with multiple fields"
    expected_events: 5
    expected_valid_apache: 4
    timeout_seconds: 15

  kubernetes_log_parsing:
    description: "Test Kubernetes pod log parsing with metadata extraction"
    expected_events: 6
    expected_valid_k8s: 5
    expected_namespaces: ["production-api", "production-db"]

  performance_intensive_processing:
    description: "Test performance with large dataset and complex VRL"
    dataset_size: 100
    min_eps: 500
    min_thg_score: 400
    timeout_seconds: 30

  vrl_syntax_errors:
    description: "Test VRL syntax error handling and structured error reporting"
    expected_success: false
    expected_error_types: ["vrl_syntax"]  # VRL syntax validation produces vrl_syntax errors
    should_fail: true

  vrl_runtime_errors:
    description: "Test VRL runtime error handling during execution"
    expected_events: 5
    expected_errors_count: 0  # Should handle errors gracefully, not fail
    min_processed_events: 3
