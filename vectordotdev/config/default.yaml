# Default Configuration for vectordotdev Python Package  
# Following config policy: CLI → ENV → .env → config file → code default

vector:
  # Vector instance configuration
  default_config_validation: true    # Validate configs by default
  auto_start: false                  # Don't auto-start Vector instances
  
  # Performance settings
  max_concurrent_sends: 1000         # Max concurrent send operations
  send_timeout_seconds: 30           # Individual send timeout
  
  # VRL configuration  
  vrl_cache_size: 1000              # Cache compiled VRL expressions
  vrl_validation_timeout: 5          # VRL syntax check timeout

logging:
  level: "INFO"                      # Default log level
  format: "structured"               # structured, plain, json
  enable_rust_logs: false           # Show Rust-level logs
  
paths:
  temp_dir: ".tmp"                   # Temporary files
  config_dir: "config"               # Configuration directory
  
runtime:
  # Resource limits
  max_memory_mb: 1024               # Memory limit for Vector instances
  thread_pool_size: 0               # 0 = auto-detect cores
  
async:
  # Async runtime configuration  
  enable_multithread: true          # Use multi-threaded async runtime
  worker_threads: 0                 # 0 = auto-detect cores