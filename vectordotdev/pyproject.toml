[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "vectordotdev"
version = "0.2.0"
requires-python = ">=3.7"
description = "Python bindings for Vector data processing pipelines with automatic version management"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "HyperSec", email = "info@hypersec.io"}
]
keywords = ["vector", "data-processing", "logging", "observability", "rust", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8", 
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "dynaconf>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0", "ruff>=0.1.0"]
test = ["pytest>=7.0", "pytest-asyncio>=0.21.0"]

[project.urls]
"Homepage" = "https://github.com/hypersec-io/vectordotdev"
"Bug Reports" = "https://github.com/hypersec-io/vectordotdev/issues"
"Source" = "https://github.com/hypersec-io/vectordotdev"
"Documentation" = "https://github.com/hypersec-io/vectordotdev#readme"
"License" = "https://hypersec.io/eula"

[tool.maturin]
manifest-path = "Cargo.toml"

[tool.maturin.environment]
RUSTFLAGS = "-C linker=gcc"
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"
