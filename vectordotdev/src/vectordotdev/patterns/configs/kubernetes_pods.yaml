# Kubernetes Pod Logs - Optimized for 300+ THG Performance
# Extracts K8s metadata with efficient parsing

sources:
  k8s_logs:
    type: stdin
    
transforms:
  parse_k8s_pods:
    type: remap
    source: |
      message_str = to_string(.message) ?? ""
      
      # K8s log format: timestamp level [component] message
      parts = split(message_str, " ")
      if length(parts) >= 4 {
          .timestamp = strip_whitespace(to_string(parts[0]))
          .level = strip_whitespace(to_string(parts[1]))
          
          # Extract component from [component] format efficiently
          component_raw = strip_whitespace(to_string(parts[2]))
          .component = replace(replace(component_raw, "[", ""), "]", "")
          
          # Join remaining parts as message (efficient)
          message_parts = slice!(parts, 3)
          .log_message = join!(message_parts, " ")
          
          # K8s specific fields (would be from context in real deployment)
          .kubernetes_namespace = "default"
          .container_name = .component
          .pod_name = .component + "-pod"
          
          # Performance optimization
          .log_type = "kubernetes_pod"
          .cluster = "production"
      }

sinks:
  console_output:
    type: console
    inputs: ["parse_k8s_pods"]
    encoding:
      codec: json