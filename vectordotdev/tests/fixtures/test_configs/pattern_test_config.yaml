# Performance testing configurations
performance_test_suites:
  high_volume:
    description: "Test patterns with high-volume log streams"
    sample_multiplier: 1000
    target_thg_minimum: 300
    patterns:
      - apache_combined_regex
      - nginx_access_regex
      - json_app_regex
      - ip_extraction_regex

  complex_patterns:
    description: "Test complex multi-part patterns"
    sample_multiplier: 100
    target_thg_minimum: 200
    patterns:
      - haproxy_http_grok
      - aws_elb_grok
      - postfix_smtp_grok

  builtin_optimization:
    description: "Test patterns that should use built-in parsers"
    sample_multiplier: 500
    target_thg_minimum: 350
    patterns:
      - json_app_regex
      - apache_combined_grok
      - syslog_base_grok